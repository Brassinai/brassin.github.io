<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect width="1600" height="900" fill="url(#canvasFade)"/>
  <ellipse cx="286" cy="132" rx="220" ry="96" fill="url(#leftGlow)"/>
  <ellipse cx="1384" cy="794" rx="288" ry="132" fill="url(#rightGlow)"/>

  <g filter="url(#windowShadow)" transform="translate(18 82)">
    <rect x="596" y="118" width="1084" height="730" rx="34" fill="#FBFAF7"/>
    <rect x="596.75" y="118.75" width="1082.5" height="728.5" rx="33.25" stroke="#E6DED1"/>
    <rect x="596" y="118" width="1084" height="78" rx="34" fill="#F4EFE7"/>
    <path d="M596 162H1680" stroke="#E8E0D4"/>

    <g filter="url(#trafficLightShadow)">
      <circle cx="660" cy="157" r="14" fill="#FF5F57" stroke="#E0443E" stroke-width="1.5"/>
      <circle cx="704" cy="157" r="14" fill="#FEBB2E" stroke="#D39A16" stroke-width="1.5"/>
      <circle cx="748" cy="157" r="14" fill="#28C840" stroke="#1EA834" stroke-width="1.5"/>
      <circle cx="655" cy="152" r="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
      <circle cx="699" cy="152" r="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
      <circle cx="743" cy="152" r="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <text x="822" y="164" fill="#4F473E" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">provision.py</text>

    <rect x="636" y="226" width="1004" height="398" rx="24" fill="#16120E"/>
    <rect x="636.75" y="226.75" width="1002.5" height="396.5" rx="23.25" stroke="#2D241A"/>
    <rect x="666" y="246" width="184" height="28" rx="14" fill="#221A11"/>
    <text x="758" y="265" text-anchor="middle" fill="#F0BF62" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">provision.py</text>

    <g font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">
      <text x="674" y="304" fill="#7F756A">1</text>
      <text x="674" y="324" fill="#7F756A">2</text>
      <text x="674" y="344" fill="#7F756A">3</text>
      <text x="674" y="364" fill="#7F756A">4</text>
      <text x="674" y="384" fill="#7F756A">5</text>
      <text x="674" y="404" fill="#7F756A">6</text>
      <text x="674" y="424" fill="#7F756A">7</text>
      <text x="674" y="444" fill="#7F756A">8</text>
      <text x="674" y="464" fill="#7F756A">9</text>
      <text x="674" y="484" fill="#7F756A">10</text>
      <text x="674" y="504" fill="#7F756A">11</text>
      <text x="674" y="524" fill="#7F756A">12</text>
      <text x="674" y="544" fill="#7F756A">13</text>
      <text x="674" y="564" fill="#7F756A">14</text>
      <text x="674" y="584" fill="#7F756A">15</text>
      <text x="674" y="604" fill="#7F756A">16</text>

      <text x="722" y="304" fill="#E2A7F6">import</text>
      <text x="790" y="304" fill="#F1C76A">inferops</text>

      <text x="722" y="324" fill="#F3ECE3">app =</text>
      <text x="788" y="324" fill="#F1C76A">inferops</text>
      <text x="876" y="324" fill="#F3ECE3">.App(</text>
      <text x="948" y="324" fill="#F1C76A">"customer-support-llm"</text>
      <text x="1188" y="324" fill="#F3ECE3">)</text>

      <text x="722" y="344" fill="#E2A7F6">@app.model(</text>
      <text x="754" y="364" fill="#E2D8CB">name=</text>
      <text x="818" y="364" fill="#F1C76A">"gpu-vllm-qwen"</text>
      <text x="986" y="364" fill="#F3ECE3">,</text>

      <text x="754" y="384" fill="#E2D8CB">engine=</text>
      <text x="836" y="384" fill="#F1C76A">"vllm"</text>
      <text x="902" y="384" fill="#F3ECE3">,</text>

      <text x="754" y="404" fill="#E2D8CB">model=</text>
      <text x="826" y="404" fill="#F1C76A">"Qwen/Qwen2.5-0.5B-Instruct"</text>
      <text x="1154" y="404" fill="#F3ECE3">,</text>

      <text x="754" y="424" fill="#E2D8CB">gpu=</text>
      <text x="810" y="424" fill="#8FD2FF">1</text>
      <text x="824" y="424" fill="#F3ECE3">,</text>

      <text x="754" y="444" fill="#E2D8CB">cpu=</text>
      <text x="810" y="444" fill="#F1C76A">"4"</text>
      <text x="850" y="444" fill="#F3ECE3">,</text>

      <text x="754" y="464" fill="#E2D8CB">memory=</text>
      <text x="834" y="464" fill="#F1C76A">"16Gi"</text>
      <text x="890" y="464" fill="#F3ECE3">,</text>

      <text x="754" y="484" fill="#E2D8CB">min_replicas=</text>
      <text x="890" y="484" fill="#8FD2FF">0</text>
      <text x="904" y="484" fill="#F3ECE3">,</text>

      <text x="754" y="504" fill="#E2D8CB">max_replicas=</text>
      <text x="890" y="504" fill="#8FD2FF">1</text>
      <text x="904" y="504" fill="#F3ECE3">,</text>

      <text x="754" y="524" fill="#E2D8CB">max_model_len=</text>
      <text x="908" y="524" fill="#8FD2FF">1024</text>
      <text x="950" y="524" fill="#F3ECE3">,</text>

      <text x="754" y="544" fill="#E2D8CB">cache_size=</text>
      <text x="882" y="544" fill="#F1C76A">"10Gi"</text>
      <text x="938" y="544" fill="#F3ECE3">,</text>

      <text x="722" y="564" fill="#F3ECE3">)</text>
      <text x="722" y="584" fill="#E2A7F6">class</text>
      <text x="782" y="584" fill="#F3ECE3">QwenChat:</text>
      <text x="754" y="604" fill="#E2A7F6">pass</text>
    </g>

    <rect x="636" y="650" width="1004" height="138" rx="24" fill="#120F0C"/>
    <rect x="636.75" y="650.75" width="1002.5" height="136.5" rx="23.25" stroke="#2B2219"/>
    <rect x="636" y="650" width="1004" height="44" rx="24" fill="#19140F"/>
    <text x="668" y="679" fill="#A29079" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.08em">TERMINAL</text>

    <g font-family="JetBrains Mono, monospace" font-size="21" font-weight="600">
      <text x="670" y="734" fill="#F0BF62">$ python provision.py</text>
      <text x="670" y="764" fill="#F1E7DA">deploying gpu-vllm-qwen...</text>
      <text x="670" y="792" fill="#8DDB9A">endpoint ready: https://api.inferops.run/gpu-vllm-qwen</text>
    </g>
  </g>

  <defs>
    <filter id="windowShadow" x="560" y="90" width="1280" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#5A4630" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="trafficLightShadow" x="640" y="140" width="124" height="34" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="canvasFade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 450) rotate(90) scale(620 1080)">
      <stop offset="0.1" stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F6F1E9"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(286 132) rotate(90) scale(96 220)">
      <stop stop-color="#F5E6CA"/>
      <stop offset="1" stop-color="#F5E6CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1384 794) rotate(90) scale(132 288)">
      <stop stop-color="#EEE3D4"/>
      <stop offset="1" stop-color="#EEE3D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
