    <rect x="1104" y="294" width="92" height="34" rx="17" fill="#F5EFE5"/>
    <text x="1150" y="316" text-anchor="middle" fill="#8E6C3B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">WORKSPACE 03</text>
    <text x="1104" y="372" fill="#1E1A16" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">GPU Workspace</text>
