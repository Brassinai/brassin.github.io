    <radialGradient id="topLeftMist" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(272 180) rotate(90) scale(124 224)">
      <stop stop-color="#F6E8CD"/>
      <stop offset="1" stop-color="#F6E8CD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomRightMist" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1328 1020) rotate(90) scale(144 280)">
      <stop stop-color="#EFE8DB"/>
      <stop offset="1" stop-color="#EFE8DB" stop-opacity="0"/>
