    <circle cx="724" cy="510" r="12" fill="#D8A74B"/>
    <circle cx="734" cy="688" r="12" fill="#D8A74B"/>
    <circle cx="876" cy="518" r="12" fill="#D8A74B"/>
    <circle cx="498" cy="362" r="8" fill="#E8DED0"/>
    <circle cx="450" cy="876" r="8" fill="#E8DED0"/>
    <circle cx="1078" cy="384" r="8" fill="#E8DED0"/>
  </g>

  <defs>
    <filter id="workspaceShadow" x="120" y="196" width="1360" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#4A3821" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="hubShadow" x="634" y="372" width="420" height="486" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
