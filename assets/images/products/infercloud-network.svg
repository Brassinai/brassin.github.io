      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 560) rotate(90) scale(760 1080)">
      <stop offset="0.18" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F7F3EC"/>
