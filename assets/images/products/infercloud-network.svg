      <stop offset="1" stop-color="#19130D"/>
    </linearGradient>
    <linearGradient id="wireA" x1="498" y1="362" x2="724" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9CEC0"/>
      <stop offset="1" stop-color="#D8A74B"/>
    </linearGradient>
    <linearGradient id="wireB" x1="450" y1="876" x2="734" y2="688" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9CEC0"/>
      <stop offset="1" stop-color="#D8A74B"/>
    </linearGradient>
    <linearGradient id="wireC" x1="1078" y1="384" x2="876" y2="518" gradientUnits="userSpaceOnUse">
