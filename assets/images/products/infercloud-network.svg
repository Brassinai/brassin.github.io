    <text x="742" y="634" fill="#8F8375" font-family="Inter, Arial, sans-serif" font-size="20">Route multiple GPU workspaces once,</text>
    <text x="742" y="666" fill="#8F8375" font-family="Inter, Arial, sans-serif" font-size="20">then share one clean access layer.</text>
