<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1040" viewBox="0 0 1672 1040" role="img" aria-labelledby="title desc">
  <title id="title">Quantization checklist foundations for LLM inference</title>
  <desc id="desc">Illustrated infographic showing a 7B chat model that is too large for a single GPU, alongside error metrics and a weight distribution with outliers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a33"/>
      <stop offset="55%" stop-color="#0b2447"/>
      <stop offset="100%" stop-color="#051426"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#1f8ea8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#1f8ea8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="83%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#f39a35" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f39a35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10294c" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0c1f3b" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cardSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17375f" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#102748" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ce1e6"/>
      <stop offset="100%" stop-color="#2ea0c5"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9e4f"/>
      <stop offset="100%" stop-color="#ffb869"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6d82"/>
      <stop offset="100%" stop-color="#124764"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02101f" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#5ce1e6" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#cfe2ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7be7ee"/>
    </marker>
    <style>
      .h1 { font: 700 36px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .h2 { font: 700 24px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .label { font: 650 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #f4f9ff; }
      .small { font: 550 15px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #d7e3f0; }
      .tiny { font: 700 14px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #b8cae0; letter-spacing: 1.6px; text-transform: uppercase; }
      .num { font: 700 22px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fff8eb; }
      .pill { font: 700 15px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #072033; letter-spacing: 0.6px; }
      .ok { fill: #92f1f2; }
      .warnText { fill: #ffe3bf; }
      .line { stroke: #90d9ef; stroke-opacity: 0.25; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1672" height="1040" fill="url(#bg)"/>
  <rect width="1672" height="1040" fill="url(#glowA)"/>
  <rect width="1672" height="1040" fill="url(#glowB)"/>
  <rect x="0" y="0" width="1672" height="1040" fill="url(#grid)" opacity="0.35"/>

  <text x="58" y="64" class="tiny">LLM Inference Example</text>
  <text x="58" y="108" class="h1">Fit a 7B chat model on one GPU</text>
  <text x="58" y="140" class="small">Quantize the weights so memory drops, while answer quality stays acceptable.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="164" rx="34" ry="34" width="792" height="820" fill="url(#card)" stroke="#96d4e6" stroke-opacity="0.18"/>
    <rect x="866" y="164" rx="34" ry="34" width="364" height="328" fill="url(#cardSoft)" stroke="#96d4e6" stroke-opacity="0.18"/>
    <rect x="866" y="522" rx="34" ry="34" width="764" height="462" fill="url(#cardSoft)" stroke="#96d4e6" stroke-opacity="0.18"/>
  </g>

  <text x="80" y="212" class="tiny">1. Define the problem space</text>
  <text x="896" y="212" class="tiny">2. Define the distortion function</text>
  <text x="896" y="570" class="tiny">3. Characterize the distribution</text>

  <g transform="translate(78 250)">
    <rect x="0" y="0" width="320" height="148" rx="24" fill="#102e56" stroke="#7be7ee" stroke-opacity="0.22"/>
    <text x="28" y="42" class="h2">7B Chat Model</text>
    <text x="28" y="78" class="label">FP16 weights + KV cache</text>
    <text x="28" y="110" class="small">Goal: serve on one GPU</text>
    <g transform="translate(208 24)">
      <rect x="0" y="0" width="62" height="80" rx="10" fill="#f39a35" opacity="0.88"/>
      <rect x="10" y="-14" width="62" height="80" rx="10" fill="#ffd39f" opacity="0.92"/>
      <rect x="20" y="-28" width="62" height="80" rx="10" fill="#5ce1e6" opacity="0.90"/>
    </g>
  </g>

  <path d="M 242 414 C 242 462, 242 486, 242 528" fill="none" stroke="url(#tealLine)" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(80 620)">
    <rect x="0" y="0" width="648" height="192" rx="28" fill="#0c2341" stroke="#6fd8ee" stroke-opacity="0.18"/>
    <text x="28" y="40" class="h2">Single GPU</text>
    <text x="28" y="74" class="label">12 GB VRAM</text>
    <rect x="30" y="102" width="586" height="34" rx="17" fill="#0a1830" stroke="#3f6c8b" stroke-opacity="0.45"/>
    <rect x="30" y="102" width="390" height="34" rx="17" fill="url(#tealLine)" opacity="0.95"/>
    <rect x="420" y="102" width="196" height="34" rx="17" fill="url(#warn)" opacity="0.95"/>
    <text x="46" y="126" class="pill">Available VRAM</text>
    <text x="434" y="126" class="pill">Overflow</text>
    <g transform="translate(474 28)">
      <rect x="0" y="0" width="132" height="42" rx="20" fill="#412331" stroke="#ffb585" stroke-opacity="0.35"/>
      <text x="25" y="28" class="label warnText">Doesn't fit</text>
    </g>
    <g transform="translate(30 146)">
      <rect x="0" y="0" width="126" height="26" rx="13" fill="#16344d"/>
      <text x="18" y="18" class="small">Weights</text>
      <rect x="144" y="0" width="142" height="26" rx="13" fill="#16344d"/>
      <text x="162" y="18" class="small">KV cache</text>
      <rect x="298" y="0" width="138" height="26" rx="13" fill="#16344d"/>
      <text x="318" y="18" class="small">Activations</text>
    </g>
  </g>

  <g transform="translate(896 252)">
    <text x="0" y="0" class="h2">Error We Care About</text>
    <rect x="0" y="30" width="292" height="160" rx="22" fill="#0d203d" stroke="#67d7ea" stroke-opacity="0.16"/>
    <text x="24" y="66" class="label">Weight error</text>
    <text x="24" y="96" class="num">MSE</text>
    <line x1="24" y1="126" x2="258" y2="126" class="line"/>
    <text x="24" y="158" class="label">Task quality</text>
    <text x="24" y="188" class="num">Perplexity drift</text>
    <g transform="translate(186 56)">
      <circle cx="28" cy="24" r="12" fill="#5ce1e6"/>
      <circle cx="56" cy="54" r="12" fill="#ffd39f"/>
      <circle cx="82" cy="18" r="12" fill="#f39a35"/>
      <path d="M 28 24 Q 58 8 82 18" fill="none" stroke="#90ebef" stroke-width="4"/>
      <path d="M 28 24 Q 44 44 56 54" fill="none" stroke="#ffc47d" stroke-width="4"/>
    </g>
  </g>

  <g transform="translate(896 642)">
    <text x="0" y="0" class="h2">Weight Distribution</text>
    <path d="M 36 180 C 132 42, 248 42, 344 180" fill="none" stroke="#8feaf2" stroke-width="5" opacity="0.85"/>
    <path d="M 344 180 C 436 70, 548 74, 634 180" fill="none" stroke="#ffd29a" stroke-width="5" opacity="0.7"/>
    <line x1="52" y1="180" x2="682" y2="180" stroke="#d9e7f6" stroke-opacity="0.22" stroke-width="2"/>
    <g opacity="0.92">
      <circle cx="118" cy="148" r="7" fill="#5ce1e6"/>
      <circle cx="140" cy="128" r="8" fill="#5ce1e6"/>
      <circle cx="164" cy="154" r="7" fill="#5ce1e6"/>
      <circle cx="188" cy="116" r="9" fill="#5ce1e6"/>
      <circle cx="212" cy="144" r="7" fill="#5ce1e6"/>
      <circle cx="238" cy="96" r="10" fill="#5ce1e6"/>
      <circle cx="264" cy="122" r="8" fill="#5ce1e6"/>
      <circle cx="292" cy="154" r="7" fill="#5ce1e6"/>
      <circle cx="472" cy="142" r="7" fill="#ffd39f"/>
      <circle cx="498" cy="114" r="8" fill="#ffd39f"/>
      <circle cx="524" cy="92" r="9" fill="#ffd39f"/>
      <circle cx="550" cy="126" r="7" fill="#ffd39f"/>
      <circle cx="576" cy="150" r="6" fill="#ffd39f"/>
      <circle cx="624" cy="154" r="7" fill="#f39a35"/>
      <circle cx="648" cy="132" r="8" fill="#f39a35"/>
      <circle cx="674" cy="120" r="9" fill="#f39a35"/>
    </g>
    <g transform="translate(16 206)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#123250"/>
      <text x="22" y="25" class="label ok">Many small weights</text>
    </g>
    <g transform="translate(458 206)">
      <rect x="0" y="0" width="188" height="38" rx="19" fill="#3b2a27"/>
      <text x="42" y="25" class="label warnText">Few outliers</text>
    </g>
  </g>
</svg>
