<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1040" viewBox="0 0 1672 1040" role="img" aria-labelledby="title desc">
  <title id="title">Choose a structure and check for a closed-form solution</title>
  <desc id="desc">A bold infographic for LLM quantization showing step 4 representation choices and step 5 closed-form availability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06182f"/>
      <stop offset="56%" stop-color="#0b2448"/>
      <stop offset="100%" stop-color="#051220"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#2bc4d4" stop-opacity="0.23"/>
      <stop offset="100%" stop-color="#2bc4d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="84%" cy="22%" r="74%">
      <stop offset="0%" stop-color="#f6a449" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f6a449" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10294c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0b1f39" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153157" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f2748" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e4ea"/>
      <stop offset="100%" stop-color="#2ca5c7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc06f"/>
      <stop offset="100%" stop-color="#ef8f2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020d1a" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83edf1"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dcecff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .h1 { font: 700 38px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .h2 { font: 700 28px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .h3 { font: 700 22px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .tiny { font: 700 15px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #bfd0e5; letter-spacing: 1.8px; text-transform: uppercase; }
      .label { font: 650 19px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #f4f9ff; }
      .small { font: 550 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #d7e3f0; }
      .pill { font: 700 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0b2136; }
      .mono { font: 700 22px Menlo, Consolas, monospace; fill: #fff0d7; }
    </style>
  </defs>

  <rect width="1672" height="1040" fill="url(#bg)"/>
  <rect width="1672" height="1040" fill="url(#glowA)"/>
  <rect width="1672" height="1040" fill="url(#glowB)"/>
  <rect width="1672" height="1040" fill="url(#grid)" opacity="0.35"/>

  <text x="48" y="56" class="tiny">Step 4 + Step 5</text>
  <text x="48" y="98" class="h1">Choose the structure, then ask if theory helps</text>
  <text x="48" y="128" class="small">Running example: quantize a 7B model's weight matrix so it fits on one GPU.</text>

  <g filter="url(#shadow)">
    <rect x="34" y="156" width="1604" height="578" rx="38" fill="url(#panel)" stroke="#99d8ea" stroke-opacity="0.18"/>
    <rect x="34" y="758" width="1604" height="224" rx="34" fill="url(#panelSoft)" stroke="#99d8ea" stroke-opacity="0.18"/>
  </g>

  <text x="72" y="198" class="tiny">Step 4. Choose the representation</text>
  <text x="72" y="804" class="tiny">Step 5. Check for a closed-form solution</text>

  <g transform="translate(72 234)">
    <rect x="0" y="0" width="468" height="376" rx="30" fill="#163157" stroke="#78dfe9" stroke-opacity="0.22"/>
    <text x="32" y="44" class="h2">Per-Tensor</text>
    <text x="32" y="78" class="label">one scale for the whole matrix</text>
    <g transform="translate(32 112)">
      <rect x="0" y="0" width="224" height="224" rx="22" fill="#0d203c" stroke="#6edce8" stroke-opacity="0.18"/>
      <g transform="translate(22 22)">
        <rect x="0" y="0" width="180" height="180" fill="#102947"/>
        <rect x="0" y="0" width="34" height="34" fill="#5ce1e6" opacity="0.92"/>
        <rect x="36" y="0" width="34" height="34" fill="#5ce1e6" opacity="0.56"/>
        <rect x="72" y="0" width="34" height="34" fill="#5ce1e6" opacity="0.34"/>
        <rect x="108" y="0" width="34" height="34" fill="#5ce1e6" opacity="0.20"/>
        <rect x="144" y="0" width="36" height="34" fill="#5ce1e6" opacity="0.12"/>
        <rect x="0" y="36" width="34" height="34" fill="#5ce1e6" opacity="0.70"/>
        <rect x="36" y="36" width="34" height="34" fill="#5ce1e6" opacity="0.48"/>
        <rect x="72" y="36" width="34" height="34" fill="#5ce1e6" opacity="0.24"/>
        <rect x="108" y="36" width="34" height="34" fill="#5ce1e6" opacity="0.18"/>
        <rect x="144" y="36" width="36" height="34" fill="#5ce1e6" opacity="0.12"/>
        <rect x="0" y="72" width="34" height="34" fill="#5ce1e6" opacity="0.42"/>
        <rect x="36" y="72" width="34" height="34" fill="#5ce1e6" opacity="0.28"/>
        <rect x="72" y="72" width="34" height="34" fill="#5ce1e6" opacity="0.92"/>
        <rect x="108" y="72" width="34" height="34" fill="#5ce1e6" opacity="0.40"/>
        <rect x="144" y="72" width="36" height="34" fill="#5ce1e6" opacity="0.18"/>
        <rect x="0" y="108" width="34" height="34" fill="#5ce1e6" opacity="0.18"/>
        <rect x="36" y="108" width="34" height="34" fill="#5ce1e6" opacity="0.22"/>
        <rect x="72" y="108" width="34" height="34" fill="#5ce1e6" opacity="0.34"/>
        <rect x="108" y="108" width="34" height="34" fill="#5ce1e6" opacity="0.58"/>
        <rect x="144" y="108" width="36" height="34" fill="#5ce1e6" opacity="0.86"/>
        <rect x="0" y="144" width="34" height="36" fill="#5ce1e6" opacity="0.10"/>
        <rect x="36" y="144" width="34" height="36" fill="#5ce1e6" opacity="0.14"/>
        <rect x="72" y="144" width="34" height="36" fill="#5ce1e6" opacity="0.20"/>
        <rect x="108" y="144" width="34" height="36" fill="#5ce1e6" opacity="0.34"/>
        <rect x="144" y="144" width="36" height="36" fill="#5ce1e6" opacity="0.68"/>
      </g>
      <path d="M 238 112 H 312" fill="none" stroke="url(#teal)" stroke-width="7" marker-end="url(#arrow)"/>
      <rect x="328" y="82" width="100" height="60" rx="22" fill="url(#teal)"/>
      <text x="356" y="120" class="pill">1 scale</text>
    </g>
    <rect x="32" y="322" width="404" height="38" rx="19" fill="#102543"/>
    <text x="58" y="347" class="small">simple, but weak when ranges differ</text>
  </g>

  <g transform="translate(602 234)">
    <rect x="0" y="0" width="468" height="376" rx="30" fill="#163157" stroke="#78dfe9" stroke-opacity="0.22"/>
    <text x="32" y="44" class="h2">Per-Channel</text>
    <text x="32" y="78" class="label">one scale per output channel</text>
    <g transform="translate(32 112)">
      <rect x="0" y="0" width="224" height="224" rx="22" fill="#0d203c" stroke="#6edce8" stroke-opacity="0.18"/>
      <g transform="translate(22 22)">
        <rect x="0" y="0" width="28" height="180" fill="#5ce1e6" opacity="0.90"/>
        <rect x="30" y="0" width="28" height="180" fill="#5ce1e6" opacity="0.68"/>
        <rect x="60" y="0" width="28" height="180" fill="#d3c8b5" opacity="0.48"/>
        <rect x="90" y="0" width="28" height="180" fill="#d3c8b5" opacity="0.66"/>
        <rect x="120" y="0" width="28" height="180" fill="#f0a64c" opacity="0.80"/>
        <rect x="150" y="0" width="30" height="180" fill="#f39a35" opacity="0.96"/>
      </g>
      <path d="M 238 112 H 312" fill="none" stroke="url(#teal)" stroke-width="7" marker-end="url(#arrow)"/>
      <g transform="translate(324 34)">
        <rect x="0" y="0" width="104" height="40" rx="16" fill="#11324f"/><text x="20" y="26" class="label">scale 1</text>
        <rect x="0" y="52" width="104" height="40" rx="16" fill="#11324f"/><text x="20" y="78" class="label">scale 2</text>
        <rect x="0" y="104" width="104" height="40" rx="16" fill="#11324f"/><text x="20" y="130" class="label">scale k</text>
      </g>
    </g>
    <rect x="32" y="322" width="404" height="38" rx="19" fill="#102543"/>
    <text x="58" y="347" class="small">better when columns have different ranges</text>
  </g>

  <g transform="translate(1132 234)">
    <rect x="0" y="0" width="468" height="376" rx="30" fill="#163157" stroke="#78dfe9" stroke-opacity="0.22"/>
    <text x="32" y="44" class="h2">Group-Wise</text>
    <text x="32" y="78" class="label">small blocks share a local scale</text>
    <g transform="translate(32 112)">
      <rect x="0" y="0" width="224" height="224" rx="22" fill="#0d203c" stroke="#6edce8" stroke-opacity="0.18"/>
      <g transform="translate(22 22)">
        <rect x="0" y="0" width="58" height="58" fill="#5ce1e6" opacity="0.88"/>
        <rect x="62" y="0" width="58" height="58" fill="#5ce1e6" opacity="0.58"/>
        <rect x="124" y="0" width="56" height="58" fill="#d6c7aa" opacity="0.68"/>
        <rect x="0" y="62" width="58" height="58" fill="#5ce1e6" opacity="0.36"/>
        <rect x="62" y="62" width="58" height="58" fill="#d6c7aa" opacity="0.90"/>
        <rect x="124" y="62" width="56" height="58" fill="#f39a35" opacity="0.74"/>
        <rect x="0" y="124" width="58" height="56" fill="#129db1" opacity="0.58"/>
        <rect x="62" y="124" width="58" height="56" fill="#e2c596" opacity="0.52"/>
        <rect x="124" y="124" width="56" height="56" fill="#f39a35" opacity="0.96"/>
        <g stroke="#deebfb" stroke-opacity="0.28" stroke-width="2">
          <path d="M 60 0 V 180"/>
          <path d="M 122 0 V 180"/>
          <path d="M 0 60 H 180"/>
          <path d="M 0 122 H 180"/>
        </g>
      </g>
      <path d="M 238 112 H 312" fill="none" stroke="url(#teal)" stroke-width="7" marker-end="url(#arrow)"/>
      <g transform="translate(324 36)">
        <rect x="0" y="0" width="104" height="40" rx="16" fill="#11324f"/><text x="16" y="26" class="label">scale g1</text>
        <rect x="0" y="52" width="104" height="40" rx="16" fill="#11324f"/><text x="16" y="78" class="label">scale g2</text>
        <rect x="0" y="104" width="104" height="40" rx="16" fill="#11324f"/><text x="16" y="130" class="label">scale g3</text>
      </g>
    </g>
    <rect x="32" y="322" width="404" height="38" rx="19" fill="#3a3227" stroke="#ffca90" stroke-opacity="0.18"/>
    <text x="76" y="347" class="small">common practical compromise</text>
  </g>

  <g transform="translate(72 828)">
    <rect x="0" y="0" width="730" height="92" rx="28" fill="#0d213b" stroke="#6edce8" stroke-opacity="0.18"/>
    <text x="28" y="34" class="h3">Theory helps</text>
    <text x="28" y="64" class="small">For idealized sources and simple metrics, theory can guide the structure choice.</text>
    <text x="28" y="84" class="small">For example, a Gaussian source with MSE has a neat analytical story.</text>
  </g>

  <g transform="translate(842 828)">
    <rect x="0" y="0" width="752" height="92" rx="28" fill="#2e2b29" stroke="#ffca90" stroke-opacity="0.20"/>
    <text x="28" y="34" class="h3">Real LLM weights</text>
    <text x="28" y="64" class="small">Usually there is no neat closed form, so we rely on empirical structure choices.</text>
    <text x="28" y="84" class="small">That is why group-wise and calibration-based methods show up in practice.</text>
  </g>
</svg>
