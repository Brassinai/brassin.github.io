<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1040" viewBox="0 0 1672 1040" role="img" aria-labelledby="title desc">
  <title id="title">Optimize, design a codebook, and control rate</title>
  <desc id="desc">A bold infographic showing step 6 optimization methods, step 7 codebook design, and step 8 rate control for LLM quantization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06182f"/>
      <stop offset="56%" stop-color="#0b2448"/>
      <stop offset="100%" stop-color="#051220"/>
    </linearGradient>
    <radialGradient id="glowA" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2cc6d5" stop-opacity="0.23"/>
      <stop offset="100%" stop-color="#2cc6d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="84%" cy="22%" r="74%">
      <stop offset="0%" stop-color="#f6a449" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f6a449" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10294c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0b1f39" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153157" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0f2748" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e4ea"/>
      <stop offset="100%" stop-color="#2ca5c7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc06f"/>
      <stop offset="100%" stop-color="#ef8f2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020d1a" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83edf1"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#dcecff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .h1 { font: 700 38px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .h2 { font: 700 28px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .h3 { font: 700 22px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #fbfdff; }
      .tiny { font: 700 15px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #bfd0e5; letter-spacing: 1.8px; text-transform: uppercase; }
      .label { font: 650 19px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #f4f9ff; }
      .small { font: 550 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #d7e3f0; }
      .pill { font: 700 16px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #0b2136; }
      .mono { font: 700 18px Menlo, Consolas, monospace; fill: #fff0d7; }
      .tag { font: 700 15px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #10243e; }
    </style>
  </defs>

  <rect width="1672" height="1040" fill="url(#bg)"/>
  <rect width="1672" height="1040" fill="url(#glowA)"/>
  <rect width="1672" height="1040" fill="url(#glowB)"/>
  <rect width="1672" height="1040" fill="url(#grid)" opacity="0.35"/>

  <text x="48" y="56" class="tiny">Step 6 + Step 7 + Step 8</text>
  <text x="48" y="98" class="h1">Optimize, build the codebook, then choose the bitrate</text>
  <text x="48" y="128" class="small">Same example: compress 7B model weights enough to fit one GPU without hurting quality too much.</text>

  <g filter="url(#shadow)">
    <rect x="34" y="156" width="1604" height="826" rx="38" fill="url(#panel)" stroke="#99d8ea" stroke-opacity="0.18"/>
  </g>

  <g transform="translate(66 198)">
    <rect x="0" y="0" width="490" height="736" rx="32" fill="url(#panelSoft)" stroke="#76dfe9" stroke-opacity="0.22"/>
    <text x="30" y="38" class="tiny">Step 6. Choose an optimization method</text>
    <text x="30" y="76" class="h2">Calibration + method</text>
    <text x="30" y="108" class="small">Use a small prompt set to search for scales that preserve useful behavior.</text>
    <g transform="translate(30 142)">
      <rect x="0" y="0" width="196" height="72" rx="20" fill="#102543"/>
      <text x="18" y="30" class="label">"Summarize this email"</text>
      <text x="18" y="54" class="small">common activations</text>
      <rect x="0" y="88" width="196" height="72" rx="20" fill="#102543"/>
      <text x="18" y="118" class="label">"Write Python code"</text>
      <text x="18" y="142" class="small">reasoning + code</text>
      <rect x="0" y="176" width="196" height="72" rx="20" fill="#102543"/>
      <text x="18" y="206" class="label">"Explain backprop"</text>
      <text x="18" y="230" class="small">teaching tone</text>
    </g>
    <path d="M 234 266 H 298" fill="none" stroke="url(#teal)" stroke-width="8" marker-end="url(#arrow)"/>
    <g transform="translate(306 142)">
      <rect x="0" y="0" width="136" height="72" rx="22" fill="url(#orange)"/>
      <text x="34" y="44" class="pill">Min-Max</text>
      <rect x="0" y="96" width="136" height="72" rx="22" fill="url(#teal)"/>
      <text x="46" y="140" class="pill">GPTQ</text>
      <rect x="0" y="192" width="136" height="72" rx="22" fill="#ffe2b7"/>
      <text x="50" y="236" class="tag">AWQ</text>
    </g>
    <g transform="translate(30 518)">
      <rect x="0" y="0" width="430" height="124" rx="24" fill="#0d213b" stroke="#6edce8" stroke-opacity="0.18"/>
      <text x="24" y="38" class="h3">What changes?</text>
      <text x="24" y="70" class="small">The chosen method decides how scales and rounding are picked.</text>
      <text x="24" y="98" class="small">Better optimization usually means less quality loss at the same bit-width.</text>
    </g>
  </g>

  <g transform="translate(592 198)">
    <rect x="0" y="0" width="490" height="736" rx="32" fill="url(#panelSoft)" stroke="#76dfe9" stroke-opacity="0.22"/>
    <text x="30" y="38" class="tiny">Step 7. Design the codebook</text>
    <text x="30" y="76" class="h2">Representative values</text>
    <text x="30" y="108" class="small">A codebook is the finite set of values the weights are allowed to use.</text>
    <g transform="translate(30 150)">
      <rect x="0" y="0" width="182" height="248" rx="24" fill="#0d213b" stroke="#6edce8" stroke-opacity="0.18"/>
      <text x="24" y="36" class="h3">Original weights</text>
      <g fill="#5ce1e6" opacity="0.92">
        <circle cx="50" cy="86" r="9"/><circle cx="78" cy="104" r="9"/><circle cx="108" cy="76" r="9"/>
        <circle cx="56" cy="136" r="9"/><circle cx="92" cy="146" r="9"/><circle cx="118" cy="126" r="9"/>
        <circle cx="64" cy="186" r="9"/><circle cx="98" cy="198" r="9"/><circle cx="126" cy="176" r="9"/>
        <circle cx="82" cy="58" r="9"/><circle cx="132" cy="98" r="9"/><circle cx="136" cy="214" r="9"/>
      </g>
      <path d="M 188 118 H 246" fill="none" stroke="url(#teal)" stroke-width="8" marker-end="url(#arrow)"/>
      <rect x="262" y="0" width="188" height="248" rx="24" fill="#0d213b" stroke="#6edce8" stroke-opacity="0.18"/>
      <text x="286" y="36" class="h3">Codebook</text>
      <g transform="translate(286 62)">
        <rect x="0" y="0" width="126" height="28" rx="12" fill="#13314f"/><text x="18" y="20" class="label">c1  = -0.75</text>
        <rect x="0" y="40" width="126" height="28" rx="12" fill="#13314f"/><text x="18" y="60" class="label">c2  = -0.25</text>
        <rect x="0" y="80" width="126" height="28" rx="12" fill="#13314f"/><text x="18" y="100" class="label">c3  =  0.25</text>
        <rect x="0" y="120" width="126" height="28" rx="12" fill="#13314f"/><text x="18" y="140" class="label">c4  =  0.75</text>
      </g>
    </g>
    <g transform="translate(30 514)">
      <rect x="0" y="0" width="430" height="128" rx="24" fill="#342a27" stroke="#ffca90" stroke-opacity="0.18"/>
      <text x="24" y="38" class="h3">Key idea</text>
      <text x="24" y="70" class="small">More codewords means finer reconstruction.</text>
      <text x="24" y="98" class="mono">K = 2^R</text>
    </g>
  </g>

  <g transform="translate(1118 198)">
    <rect x="0" y="0" width="470" height="736" rx="32" fill="url(#panelSoft)" stroke="#76dfe9" stroke-opacity="0.22"/>
    <text x="30" y="38" class="tiny">Step 8. Control the rate</text>
    <text x="30" y="76" class="h2">Choose the bit-width</text>
    <text x="30" y="108" class="small">Lower bits save memory, but usually raise distortion.</text>
    <g transform="translate(46 144)">
      <path d="M 44 232 A 166 166 0 0 1 378 232" fill="none" stroke="#223b60" stroke-width="34" stroke-linecap="round"/>
      <path d="M 44 232 A 166 166 0 0 1 208 66" fill="none" stroke="#67e4ea" stroke-width="34" stroke-linecap="round"/>
      <path d="M 208 66 A 166 166 0 0 1 378 232" fill="none" stroke="#f39a35" stroke-width="34" stroke-linecap="round"/>
      <line x1="210" y1="226" x2="316" y2="128" stroke="#fff0d7" stroke-width="8" stroke-linecap="round"/>
      <circle cx="210" cy="226" r="16" fill="#f39a35"/>
      <text x="8" y="274" class="label">FP16</text>
      <text x="170" y="30" class="label">INT8</text>
      <text x="360" y="274" class="label">INT4</text>
      <rect x="140" y="302" width="154" height="44" rx="20" fill="#352b28" stroke="#ffca90" stroke-opacity="0.24"/>
      <text x="174" y="331" class="label">chosen point</text>
    </g>
    <g transform="translate(42 584)">
      <rect x="0" y="0" width="386" height="38" rx="19" fill="#102543"/>
      <text x="22" y="25" class="small">bits down -> memory down</text>
      <rect x="0" y="50" width="386" height="38" rx="19" fill="#342a27" stroke="#ffca90" stroke-opacity="0.18"/>
      <text x="22" y="75" class="small">bits down -> quality risk up</text>
    </g>
  </g>
</svg>
